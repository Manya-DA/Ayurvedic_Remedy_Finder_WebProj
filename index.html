<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ayurvedic Remedy Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gradient-to-br from-yellow-50 to-green-50 text-gray-800 font-sans min-h-screen">
  <header class="text-center py-10 bg-gradient-to-r from-green-400 via-emerald-400 to-yellow-300 shadow-lg">
    <h1 class="text-5xl font-extrabold text-white drop-shadow-lg">🌿 Ayurvedic Remedy Finder</h1>
    <p class="text-white mt-3 text-lg font-semibold">Discover natural cures powered by AI & Ancient Wisdom</p>
  </header>

  <main class="max-w-5xl mx-auto p-8">
    <div class="flex flex-col md:flex-row gap-4 items-center justify-center">
      <input id="symptomInput" type="text" placeholder="Enter symptom (e.g., headache, cold, fever)" 
        class="flex-grow p-4 rounded-xl border-2 border-green-400 focus:outline-none focus:ring-4 focus:
        ring-green-300 shadow-md text-lg" />
      <button id="searchBtn" class="bg-gradient-to-r from-green-500 to-emerald-600 text-white px-8 py-4
      rounded-xl hover:from-green-600 hover:to-emerald-700 transition transform hover:scale-105 shadow-lg 
      font-bold text-lg">
        Search Remedies
      </button>
    </div>

    <section id="resultArea" class="mt-12 p-8 bg-white rounded-2xl shadow-2xl min-h-[400px]">
      <p class="text-center text-gray-500 text-lg">🔍 Enter a symptom and hit search to discover Ayurvedic
         remedies</p>
    </section>
  </main>

  <footer class="text-center p-6 mt-12 border-t-2 border-yellow-200 text-sm text-yellow-800">
    &copy; 2025 Ayurveda Finder | Powered by AI & Traditional Medicine
  </footer>

  <script src="script.js"></script>
</body>
</html>
